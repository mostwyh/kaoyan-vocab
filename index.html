<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>考研英语词汇周计划 · 按页词表</title>
<style>
:root{
  --bg:#f4f1ea;
  --panel:#fffdf8;
  --panel2:#f8f4ec;
  --ink:#1e1c19;
  --ink2:#6b6459;
  --ink3:#948b7d;
  --line:#e6ddce;
  --red:#c8322b;
  --red2:#e2564e;
  --gold:#b8873a;
  --shadow:0 6px 20px rgba(70,50,25,.08);
  --h:70px;
  color-scheme: light;
}
[data-theme="dark"]{
  --bg:#15171a;
  --panel:#1d2024;
  --panel2:#23272c;
  --ink:#e9e7e2;
  --ink2:#a2a8ae;
  --ink3:#7d848b;
  --line:#2e333a;
  --red:#e2564e;
  --red2:#ff7d73;
  --gold:#d8a856;
  --shadow:0 8px 24px rgba(0,0,0,.5);
  color-scheme: dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.65 "PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input[type=range]{accent-color:var(--red)}

/* ---------- top bar ---------- */
.bar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:12px 22px;background:color-mix(in srgb, var(--panel) 92%, transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:9px;height:30px;border-radius:5px;background:linear-gradient(180deg,var(--red),var(--red2))}
.brand h1{margin:0;font-size:16px;letter-spacing:.3px}
.brand p{margin:1px 0 0;font-size:11.5px;color:var(--ink2)}
.brand b{color:var(--ink)}
.search{flex:1;min-width:220px;max-width:460px}
#q{
  width:100%;padding:9px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel2);color:var(--ink);font-size:14px;outline:none;
}
#q:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(200,50,43,.12)}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
.sw{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.sw input{accent-color:var(--red)}
.btn{
  padding:6px 11px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);
  font-size:12.5px;color:var(--ink);white-space:nowrap;text-decoration:none;display:inline-block;
}
.btn:hover{border-color:var(--red);color:var(--red)}
.btn.link{color:var(--ink2)}

/* ---------- play bar ---------- */
.playbar{
  position:sticky;top:var(--h);z-index:25;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:9px 22px;background:var(--panel);border-bottom:1px solid var(--line);
}
.pg{display:flex;gap:8px}
.primary{
  padding:8px 15px;border-radius:10px;background:var(--red);color:#fff;font-size:13px;font-weight:600;
  box-shadow:0 2px 8px rgba(200,50,43,.24);transition:.15s;
}
.primary:hover{background:var(--red2)}
.primary.alt{background:#33404f;box-shadow:none}
.primary.alt:hover{background:#415063}
.primary.on{outline:3px solid rgba(200,50,43,.22)}
.opts{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.rng{display:flex;align-items:center;gap:6px}
.rng input{width:82px}
.rng b{color:var(--ink);font-variant-numeric:tabular-nums;min-width:28px}
.np{margin-left:auto;font-size:12.5px;color:var(--ink2);max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.np b{color:var(--red)}

/* ---------- page jump strip ---------- */
.jump{
  display:flex;gap:4px;overflow-x:auto;padding:8px 22px;background:var(--bg);
  border-bottom:1px solid var(--line);position:sticky;top:calc(var(--h) + 47px);z-index:20;
  scrollbar-width:thin;
}
.jump a{
  flex:0 0 auto;min-width:26px;text-align:center;padding:2px 6px;border-radius:6px;
  font-size:11.5px;color:var(--ink2);text-decoration:none;border:1px solid transparent;
  font-variant-numeric:tabular-nums;
}
.jump a:hover{background:var(--panel2);color:var(--red);border-color:var(--line)}
.jump a.w2{color:var(--gold)}
.jump a.w3{color:var(--red)}

/* ---------- list ---------- */
.list{max-width:820px;margin:0 auto;padding:10px 22px 120px}
.pgblock{margin:18px 0 6px}
.pghead{
  display:flex;align-items:baseline;gap:10px;margin:0 0 8px;padding:6px 2px;
  position:sticky;top:calc(var(--h) + 47px + 40px);z-index:10;
  background:linear-gradient(180deg, var(--bg) 72%, transparent);
}
.pgno{font-size:15px;font-weight:700;letter-spacing:.4px}
.pgno small{font-weight:400;color:var(--ink2);font-size:12px;margin-left:6px}
.pgsub{font-size:11.5px;color:var(--ink3)}
.pgcount{margin-left:auto;font-size:11.5px;color:var(--ink3)}

.rows{display:flex;flex-direction:column;gap:2px;border-left:2px solid var(--line);padding-left:14px}
.row{
  display:grid;grid-template-columns:180px minmax(0,1fr) 44px;gap:2px 16px;align-items:start;
  padding:8px 10px;border-radius:10px;border:1px solid transparent;
}
.row:hover{background:var(--panel);border-color:var(--line)}
.row.speaking{background:rgba(200,50,43,.09);border-color:rgba(200,50,43,.35)}
.row .cell{display:flex;flex-direction:column;min-width:0}
.row .w{
  font-family:Georgia,"Times New Roman",serif;font-size:17px;font-weight:600;color:var(--red);
  text-align:left;padding:0;line-height:1.35;word-break:break-word;
}
.row .w:hover{text-decoration:underline}
.row .ph{font-family:Georgia,serif;font-size:12px;color:var(--ink3);line-height:1.4}
.row .line2{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.row .pos{
  font-size:11.5px;color:var(--red);background:rgba(200,50,43,.09);
  padding:1px 6px;border-radius:5px;white-space:nowrap;
}
.row .cn{font-size:14px;color:var(--ink);line-height:1.6}
.row .note{margin-top:2px;font-size:12px;color:var(--ink3);border-left:2px solid var(--gold);padding-left:8px}
.row .star{
  font-size:15px;color:var(--line);padding:0 2px;line-height:1;transition:.15s;
}
.row .star:hover{color:var(--gold)}
.row .star.on{color:var(--gold)}
.row .cell.right{align-items:flex-end;gap:3px}
.row .pgtag{
  font-size:10.5px;color:var(--ink3);letter-spacing:.3px;font-variant-numeric:tabular-nums;
  border:1px solid var(--line);border-radius:4px;padding:0 4px;line-height:1.5;
}

body.hide-cn .row .cn, body.hide-cn .row .note{filter:blur(6px);cursor:pointer;user-select:none;transition:filter .15s}
body.hide-cn .row.revealed .cn, body.hide-cn .row.revealed .note{filter:none}
body.no-note .row .note{display:none}
body.only-star .row:not(.starred){display:none}
body.only-star .pgblock:not(:has(.row.starred)){display:none}

.empty{padding:60px 0;text-align:center;color:var(--ink2)}

.foot{
  position:fixed;left:0;right:0;bottom:0;padding:8px 22px;font-size:12px;color:var(--ink3);
  background:color-mix(in srgb, var(--panel) 92%, transparent);border-top:1px solid var(--line);
  backdrop-filter:blur(8px);
}

.toast{
  position:fixed;left:50%;bottom:52px;transform:translate(-50%,10px);opacity:0;pointer-events:none;
  background:rgba(30,28,25,.92);color:#fff;padding:8px 14px;border-radius:9px;font-size:13px;
  transition:.2s;z-index:60;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:820px){
  .bar{padding:8px 12px;gap:8px}
  .brand p{display:none}
  .tools{gap:6px}
  .btn{padding:4px 8px;font-size:12px}
  .primary{padding:7px 12px;font-size:12.5px}
  .search{order:3;flex-basis:100%;max-width:none;min-width:0}
  .tools{order:2;margin-left:auto}
  .playbar .opts{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .playbar .rng,.playbar .sw{flex:0 0 auto;white-space:nowrap}
  .playbar .rng input{width:58px}
  .bar{position:static}
  .playbar{padding:6px 12px 7px;gap:8px;position:sticky;top:0;z-index:40}
  .playbar .pg{gap:6px}
  .playbar .opts{gap:10px;font-size:12px}
  .playbar .rng input{width:64px}
  .jump{padding:6px 14px;position:static}
  .list{padding:8px 14px 100px}
  .pghead{position:static}
  .row{grid-template-columns:1fr auto;gap:0 10px}
  .row .cell:nth-child(1){grid-column:1;grid-row:1}
  .row .cell.right{grid-column:2;grid-row:1}
  .row .cell:nth-child(2){grid-column:1/-1;grid-row:2;margin-top:3px}
  .row .line2{display:block}
  .row .line2 .pos{display:inline-block;margin-right:5px;vertical-align:1px}
  .playbar{padding:6px 10px;gap:8px}
  .playbar .primary{padding:8px 10px}
  .rng{font-size:11.5px;gap:4px}
  .rng input[type=range]{width:64px}
  .jump{padding:5px 10px}
  .row .w{font-size:16px}
  .np{display:none}
  .brand h1{font-size:14px}
  .foot{font-size:11px;padding:6px 14px}
}

@media print{
  .bar,.playbar,.jump,.foot,.toast,.star{display:none!important}
  .list{padding:0;max-width:none}
  .row{break-inside:avoid;border:0;padding:2px 0}
  body{background:#fff;color:#000}
  .row .w{color:#000}
  .pghead{position:static;background:none}
}

</style>
</head>

</footer>

ic policy 进步性公共政策","seq":1,"y":0.5,"x":0.5},{"p":90,"ph":46,"w":"clash","pho":"klæʃ","pos":"n./v.","cn":"冲突；争论,交锋；(金属等的)碰撞声；发生冲突；不相容,抵触","note":"搭配 clash with 与……冲突","seq":2,"y":0.5,"x":0.5},{"p":90,"ph":46,"w":"comparison","pho":"kəmˈpærəsn","pos":"n.","cn":"(with/to)比较,对比；比喻","note":"搭配 by comparison 比较起来","seq":3,"y":0.6111,"x":0.1194},{"p":90,"ph":46,"w":"prompt","pho":"prɒmpt","pos":"n./vt./a.","cn":"提示；促进,推动；激起；敏捷的,迅速的,即刻的","note":"派生 prompting n. 刺激,激励","seq":4,"y":0.7119,"x":0.1106},{"p":91,"ph":46,"w":"consultant","pho":"kənˈsʌltənt","pos":"n.","cn":"顾问；会诊医师,专科医生","note":"派生 consultancy n. 咨询公司","seq":5,"y":0.26,"x":0.5122},{"p":91,"ph":46,"w":"adopt","pho":"əˈdɒpt","pos":"vt.","cn":"采用,采取；收养","note":"派生 adopted a. 领养的,收养的；adoption n. 领养,收养","seq":6,"y":0.3926,"x":0.5128},{"p":91,"ph":46,"w":"constituent","pho":"kənˈstɪtjuənt","pos":"a./n.","cn":"组成的,构成的；成分,要素","note":"","seq":7,"y":0.4756,"x":0.5133},{"p":91,"ph":46,"w":"pose","pho":"pəʊz","pos":"vt./vi./n.","cn":"造成(困难等)；提出(问题),陈述(观点)；摆姿势；假装,冒充；姿势","note":"搭配 pose as 冒充；pose a threat 构成威胁","seq":8,"y":0.5933,"x":0.515},{"p":91,"ph":46,"w":"constrain","pho":"kənˈstreɪn","pos":"vt.","cn":"阻止,妨碍；限制,限定","note":"记 con-(=together)+strain(拉紧)；派生 constraint n. 限制","seq":9,"y":0.8044,"x":0.5144},{"p":92,"ph":47,"w":"register","pho":"ˈredʒɪstə","pos":"v./n.","cn":"登记,注册；把(邮件)挂号；(仪表等)指示,自动记下；流露,表达；登记簿","note":"搭配 register with 向……登记","seq":0,"y":0.5,"x":0.5},{"p":92,"ph":47,"w":"release","pho":"rɪˈliːs","pos":"vt./n.","cn":"释放,解放；公开发表,发布；放开,松开；发布,发行","note":"搭配 general release 全面发布","seq":1,"y":0.2822,"x":0.2187},{"p":92,"ph":47,"w":"suspect","pho":"ˈsʌspekt","pos":"n./v.","cn":"嫌疑犯,可疑分子；怀疑","note":"搭配 suspect sb. of (doing) sth.；辨析 doubt 怀疑……不是 / suspect 怀疑……是","seq":2,"y":0.3422,"x":0.1061},{"p":92,"ph":47,"w":"tolerance","pho":"ˈtɒlərəns","pos":"n.","cn":"容忍,宽容；(痛苦、困难等的)程度,忍耐力","note":"","seq":3,"y":0.6785,"x":0.0789},{"p":92,"ph":47,"w":"settlement","pho":"ˈsetlmənt","pos":"n.","cn":"居住区,住宅区；(解决纷争的)协议；解决,处理","note":"","seq":4,"y":0.5,"x":0.5},{"p":93,"ph":47,"w":"participate","pho":"pɑːˈtɪsɪpeɪt","pos":"vi.","cn":"(in)参与,参加","note":"记 part(i)+cip(=take)+-ate；take part (in) 参加,参与","seq":5,"y":0.2385,"x":0.5083},{"p":93,"ph":47,"w":"shrink","pho":"ʃrɪŋk","pos":"vi.","cn":"起皱,收缩；退缩,畏缩","note":"搭配 shrink from (doing) sth. 畏缩不敢做某事；派生 shrinkage n. 收缩","seq":6,"y":0.4156,"x":0.5122},{"p":93,"ph":47,"w":"rare","pho":"reə","pos":"a.","cn":"稀有的,难得的；(肉)煮得很嫩的,半熟的","note":"搭配 rare bird 不同寻常的人；辨析 rare 长期缺少而珍贵 / scarce 暂时缺乏","seq":7,"y":0.5793,"x":0.5128},{"p":93,"ph":47,"w":"stern","pho":"stɜːn","pos":"a./n.","cn":"严厉的,苛刻的；严肃的,不苟言笑的；船尾","note":"例 a stern challenge 严峻的挑战","seq":8,"y":0.5,"x":0.5},{"p":93,"ph":47,"w":"alternative","pho":"ɔːlˈtɜːnətɪv","pos":"a./n.","cn":"两者挑一的；(to)可供选择的事物","note":"搭配 alternative to ……的替代品","seq":9,"y":0.8807,"x":0.5133},{"p":94,"ph":48,"w":"exploit","pho":"ɪkˈsplɔɪt","pos":"vt./n.","cn":"利用；开发,开采(资源、矿产等)；剥削；英勇的行为","note":"派生 exploitation n. ①利用 ②开发,开采 ③剥削；记 ex-(=out)+ploit(折)→“榨出来”，对比 employ(折进去)","seq":0,"y":0.5,"x":0.5},{"p":94,"ph":48,"w":"substantial","pho":"səbˈstænʃl","pos":"a.","cn":"大量的,多的；结实的,坚固的","note":"搭配 a substantial salary 丰厚的薪水；派生 substantially ad. 大量地,可观地","seq":1,"y":0.5526,"x":0.2772},{"p":94,"ph":48,"w":"construct","pho":"kənˈstrʌkt","pos":"vt./n.","cn":"建造,建设；创立；构想,概念；建造物","note":"名词读 ˈkɒnstrʌkt；辨析 obstruct v. 阻碍,阻止","seq":2,"y":0.7126,"x":0.275}]};

<script>
/* 按页词表：点读 + 播一遍 / 循环播放 + 释义自测 + 生词本 */
(() => {
  "use strict";
  const DATA = window.WORDS;
  const $ = s => document.querySelector(s);
  const el = (t, cls, txt) => { const n = document.createElement(t); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };

  const K = { theme: "vl.theme", star: "vl.star", pref: "vl.pref" };
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const star = new Set(load(K.star, []));
  const pref = load(K.pref, { rate: .9, gap: 600, cn: false, hideCn: false, onlyStar: false });
  const key = r => r.p + "|" + r.w;

  /* ---------------- speech ---------------- */
  let voices = [];
  const refreshVoices = () => { voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; };
  refreshVoices();
  if (window.speechSynthesis) speechSynthesis.onvoiceschanged = refreshVoices;

  const PREFERRED = [/Natural/i, /Google US English/i, /Aria/i, /Jenny/i, /Samantha/i, /Zira/i, /Microsoft.*English/i];
  function pickVoice(lang) {
    const list = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith(lang.slice(0, 2)));
    if (!list.length) return null;
    for (const re of PREFERRED) { const hit = list.find(v => re.test(v.name)); if (hit) return hit; }
    return list.find(v => v.lang.toLowerCase() === lang.toLowerCase()) || list[0];
  }

  function speak(text, lang = "en-US", rate = pref.rate) {
    return new Promise(resolve => {
      if (!text) return resolve();
      if (!window.speechSynthesis) return setTimeout(resolve, 300);
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang; u.rate = rate || .9;
      const v = pickVoice(lang);
      if (v) u.voice = v;
      let done = false;
      const fin = () => { if (done) return; done = true; resolve(); };
      u.onend = fin; u.onerror = fin;
      try { speechSynthesis.speak(u); } catch { fin(); }
      setTimeout(fin, Math.max(2200, (text.length * 260) / Math.max(rate, .4)));
    });
  }
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  /* ---------------- build ---------------- */
  const S = { items: [], idx: -1, playing: false, mode: "once", token: 0, q: "" };

  const weekOf = p => (p <= 47 ? 1 : p <= 94 ? 2 : 3);
  const photoOf = p => Math.floor((p + 2) / 2);

  // 倒序只反转「页」的顺序，页内词条仍按书上的先后
  const pageOrder = [...new Set(DATA.rows.map(r => r.p))];
  const byPage = new Map(pageOrder.map(p => [p, DATA.rows.filter(r => r.p === p)]));
  const descRows = pageOrder.slice().reverse().flatMap(p => byPage.get(p));

  function visibleRows() {
    const q = S.q.trim().toLowerCase();
    const base = pref.desc ? descRows : DATA.rows;
    return base.filter(r => {
      if (pref.onlyStar && !star.has(key(r))) return false;
      if (!q) return true;
      return r.w.toLowerCase().includes(q) || (r.cn || "").includes(S.q.trim());
    });
  }

  function render() {
    const list = $("#list");
    list.textContent = "";
    const rows = visibleRows();
    S.items = [];

    let block = null, curPage = -1, count = 0;
    const flush = () => { if (block) block.querySelector(".pgcount").textContent = count + " 词"; };

    rows.forEach((r, i) => {
      if (r.p !== curPage) {
        flush();
        curPage = r.p; count = 0;
        block = el("section", "pgblock");
        block.id = "p" + r.p;
        const head = el("div", "pghead");
        const no = el("span", "pgno", `第 ${r.p} 页`);
        no.appendChild(el("small", "", `Week ${weekOf(r.p)}`));
        head.append(no, el("span", "pgsub", `第 ${r.ph} 张照片`), el("span", "pgcount", ""));
        block.appendChild(head);
        const wrap = el("div", "rows");
        block.appendChild(wrap);
        block._rows = wrap;
        list.appendChild(block);
      }
      count++;

      const row = el("div", "row" + (star.has(key(r)) ? " starred" : ""));
      row.dataset.i = i;
      row.dataset.p = r.p;

      const cellA = el("div", "cell");
      const wbtn = el("button", "w", r.w);
      wbtn.title = "点一下朗读";
      cellA.appendChild(wbtn);
      if (r.pho) cellA.appendChild(el("span", "ph", `[${r.pho}]`));

      const cellB = el("div", "cell");
      const l2 = el("div", "line2");
      if (r.pos) l2.appendChild(el("span", "pos", r.pos));
      l2.appendChild(el("span", "cn", r.cn || ""));
      cellB.appendChild(l2);
      if (r.note) cellB.appendChild(el("div", "note", r.note));

      const st = el("button", "star" + (star.has(key(r)) ? " on" : ""), "★");
      st.title = "加入 / 移出生词本";

      const cellC = el("div", "cell right");
      cellC.appendChild(el("span", "pgtag", "P" + r.p));
      cellC.appendChild(st);

      row.append(cellA, cellB, cellC);
      block._rows.appendChild(row);

      wbtn.addEventListener("click", () => { S.idx = i; speakOne(r, row); });
      st.addEventListener("click", () => {
        if (star.has(key(r))) star.delete(key(r)); else star.add(key(r));
        st.classList.toggle("on", star.has(key(r)));
        row.classList.toggle("starred", star.has(key(r)));
        save(K.star, [...star]);
        $("#starCount") && ($("#starCount").textContent = star.size);
        if (pref.onlyStar) render();
      });
      row.addEventListener("click", ev => {
        if (ev.target.closest(".w") || ev.target.closest(".star")) return;
        if (pref.hideCn) row.classList.toggle("revealed");
      });

      S.items.push({ r, row, wbtn });
    });
    flush();

    if (!rows.length) {
      list.appendChild(el("div", "empty", "没有匹配的词，换个拼写或中文试试。"));
    }
    $("#footNote").textContent = S.q
      ? `筛选出 ${rows.length} 个词 · Esc 清空搜索`
      : `共 ${DATA.rows.length} 个词 / ${new Set(DATA.rows.map(r => r.p)).size} 页 · 点单词朗读，空格播放，M 遮词`;
  }

  function speakOne(r, row) {
    highlight(row);
    $("#np").innerHTML = `正在读 <b>${r.w}</b>`;
    return speak(r.w);
  }

  function highlight(row) {
    document.querySelectorAll(".row.speaking").forEach(n => n.classList.remove("speaking"));
    if (row) { row.classList.add("speaking"); S.idx = +row.dataset.i; }
  }

  /* ---------------- playback ---------------- */
  async function play(mode) {
    stop();
    S.mode = mode; S.playing = true;
    const my = ++S.token;
    $("#onceBtn").classList.toggle("on", mode === "once");
    $("#loopBtn").classList.toggle("on", mode === "loop");
    const rate = pref.rate;

    while (S.token === my) {
      const start = S.idx < 0 ? 0 : S.idx;
      for (let i = start; i < S.items.length; i++) {
        if (S.token !== my) return;
        const it = S.items[i];
        if (!it.row.isConnected) continue;
        S.idx = i;
        highlight(it.row);
        it.row.scrollIntoView({ block: "center", behavior: "smooth" });
        $("#np").innerHTML = `正在读 <b>${it.r.w}</b> · ${i + 1}/${S.items.length}`;
        await speak(it.r.w, "en-US", rate);
        if (S.token !== my) return;
        if (pref.cn && it.r.cn) { await speak(it.r.cn, "zh-CN", rate); if (S.token !== my) return; }
        await sleep(pref.gap);
        if (S.token !== my) return;
      }
      if (mode !== "loop") break;
      S.idx = 0;
      await sleep(600);
    }
    stop();
  }

  function stop() {
    S.token++;
    S.playing = false;
    if (window.speechSynthesis) speechSynthesis.cancel();
    $("#onceBtn").classList.remove("on");
    $("#loopBtn").classList.remove("on");
    document.querySelectorAll(".row.speaking").forEach(n => n.classList.remove("speaking"));
    $("#np").textContent = "就绪";
  }

  /* ---------------- controls ---------------- */
  const q = $("#q");
  let qt = 0;
  q.addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value; render(); }, 120); });
  q.addEventListener("keydown", e => { if (e.key === "Escape") { q.value = ""; S.q = ""; render(); q.blur(); } });

  $("#hideCn").checked = pref.hideCn;
  document.body.classList.toggle("hide-cn", pref.hideCn);
  $("#hideCn").addEventListener("change", e => {
    pref.hideCn = e.target.checked; save(K.pref, pref);
    document.body.classList.toggle("hide-cn", pref.hideCn);
  });

  $("#onlyStar").checked = pref.onlyStar;
  document.body.classList.toggle("only-star", pref.onlyStar);
  $("#onlyStar").addEventListener("change", e => {
    pref.onlyStar = e.target.checked; save(K.pref, pref);
    document.body.classList.toggle("only-star", pref.onlyStar);
    render();
  });

  $("#rate").value = pref.rate; $("#rateVal").textContent = (+pref.rate).toFixed(2);  $("#rate").addEventListener("input", e => {
    pref.rate = +e.target.value; save(K.pref, pref);
    $("#rateVal").textContent = (+pref.rate).toFixed(2);
  });
  $("#gap").value = pref.gap; $("#gapVal").textContent = (pref.gap / 1000).toFixed(1) + "s";
  $("#gap").addEventListener("input", e => {
    pref.gap = +e.target.value; save(K.pref, pref);
    $("#gapVal").textContent = (pref.gap / 1000).toFixed(1) + "s";
  });
  $("#readCn").checked = pref.cn;
  $("#readCn").addEventListener("change", e => { pref.cn = e.target.checked; save(K.pref, pref); });

  const orderBtn = $("#orderBtn");
  orderBtn.textContent = pref.desc ? "正序" : "倒序";
  orderBtn.addEventListener("click", () => {
    pref.desc = !pref.desc; save(K.pref, pref);
    orderBtn.textContent = pref.desc ? "正序" : "倒序";
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  $("#onceBtn").addEventListener("click", () => play("once"));
  $("#loopBtn").addEventListener("click", () => play("loop"));
  $("#stopBtn").addEventListener("click", stop);

  $("#themeBtn").addEventListener("click", () => {
    const dark = document.documentElement.dataset.theme === "dark";
    document.documentElement.dataset.theme = dark ? "" : "dark";
    save(K.theme, dark ? "" : "dark");
  });
  document.documentElement.dataset.theme = load(K.theme, "");

  $("#printBtn").addEventListener("click", () => window.print());

  $("#csvBtn").addEventListener("click", () => {
    const cell = s => `"${String(s || "").replace(/"/g, '""')}"`;
    const lines = ["页码,单词,音标,词性,中文释义,注释"];
    DATA.rows.forEach(r => lines.push([r.p, cell(r.w), cell(r.pho), cell(r.pos), cell(r.cn), cell(r.note)].join(",")));
    const blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "考研词汇_按页.csv";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    toast(`已导出 ${DATA.rows.length} 个词`);
  });

  document.addEventListener("keydown", e => {
    const typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
    if (e.key === "/" && !typing) { e.preventDefault(); q.focus(); return; }
    if (typing) return;
    switch (e.key) {
      case " ": e.preventDefault(); S.playing ? stop() : play("once"); break;
      case "o": case "O": play("once"); break;
      case "l": case "L": play("loop"); break;
      case "m": case "M": $("#hideCn").click(); break;
      case "Escape": stop(); break;
    }
  });

  /* ---------------- jump strip ---------------- */
  (function buildJump() {
    const jump = $("#jump");
    const pages = [...new Set(DATA.rows.map(r => r.p))];
    pages.forEach(p => {
      const a = el("a", weekOf(p) === 2 ? "w2" : weekOf(p) === 3 ? "w3" : "", String(p));
      a.href = "#p" + p;
      a.title = `第 ${p} 页 · ${DATA.rows.filter(r => r.p === p).length} 词`;
      jump.appendChild(a);
    });
  })();

  let tt = 0;
  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 1800);
  }

  /* ---------------- boot ---------------- */
  $("#total").textContent = DATA.rows.length;
  $("#pages").textContent = new Set(DATA.rows.map(r => r.p)).size;
  $("#starCount") && ($("#starCount").textContent = star.size);
  render();
})();

</script>
</body>
</html>
